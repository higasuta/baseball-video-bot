name: MLB Playball Bot (Cloud Auto)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-mlb-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg and Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          # ✅ google-genai (最新SDK) をインストールするように修正
          pip install -U requests google-genai yt-dlp

      - name: Run Bot
        env:
          INSTA_BUSINESS_ID: ${{ secrets.INSTA_BUSINESS_ID }}
          INSTA_ACCESS_TOKEN: ${{ secrets.INSTA_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODE: false
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "bot@example.com"
          git config --local user.name "PlayballBot"
          rm -f temp_video.mp4 output.mp4 subtitles.srt
          git add history.txt stats.json
          git commit -m "Update history [skip ci]" || echo "No changes"
          git push origin main
