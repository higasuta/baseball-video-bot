name: MLB Playball Bot (Cloud Auto)

on:
  schedule:
    - cron: '*/10 * * * *' # 10分おき
  workflow_dispatch:

jobs:
  run-mlb-bot:
    runs-on: ubuntu-latest # GitHubのサーバーを使用
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 日本語字幕の焼き付けに必須
      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -U requests google-generativeai yt-dlp

      - name: Run Bot
        env:
          INSTA_BUSINESS_ID: ${{ secrets.INSTA_BUSINESS_ID }}
          INSTA_ACCESS_TOKEN: ${{ secrets.INSTA_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODE: false
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "bot@example.com"
          git config --local user.name "PlayballBot"
          git add history.txt stats.json
          git commit -m "Update history [skip ci]" || echo "No changes"
          git push origin main
