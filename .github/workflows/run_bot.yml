name: Baseball Video Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # 15分から10分おきに変更（投稿頻度3割増設定）
  workflow_dispatch:      # 手動実行ボタン
    inputs:
      test_mode:
        description: 'Set to true for testing'
        default: 'false'
        required: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # history.txtとstats.jsonを保存するために必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp
          pip install requests google-generativeai

      - name: Run bot
        env:
          INSTA_BUSINESS_ID: ${{ secrets.INSTA_BUSINESS_ID }}
          INSTA_ACCESS_TOKEN: ${{ secrets.INSTA_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        # -u を付けることでログが溜まらずにリアルタイムで表示されます
        run: python -u main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.txt stats.json
          git commit -m "Update history and stats [skip ci]" || echo "No changes to commit"
          git push