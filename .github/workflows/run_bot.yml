name: Playball Bot (Self-hosted Runner)

on:
  schedule:
    - cron: '*/10 * * * *' # 10分おきに実行
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  run-bot:
    # クラウドではなく、あなたの自宅PC（Self-hosted）で動かす指定
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 履歴の衝突を防ぐための同期
      - name: Sync Repository
        run: |
          git config --local user.email "bot@example.com"
          git config --local user.name "PlayballBot"
          git pull origin main --rebase

      # 2. 依存ライブラリの更新（yt-dlpは常に最新にする）
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U requests google-generativeai yt-dlp

      # 3. メインスクリプトの実行
      # 環境変数はGitHubのSettings > Secretsに登録したものを使用
      - name: Run Playball Bot
        env:
          INSTA_BUSINESS_ID: ${{ secrets.INSTA_BUSINESS_ID }}
          INSTA_ACCESS_TOKEN: ${{ secrets.INSTA_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODE: false
        run: python main.py

      # 4. 投稿済みID(history.txt)と比率(stats.json)を保存
      - name: Commit and Push Changes
        run: |
          git add history.txt stats.json
          git commit -m "Update history and stats [skip ci]" || echo "No changes to commit"
          git push origin main
